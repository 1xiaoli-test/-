<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" class=""><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试小站</title>
<link rel="stylesheet" href="styles.css">
<script>
  // 尽早应用主题，避免刷新时闪烁（与系统偏好一致或用记忆值）
  (function () {
    try {
      var t = localStorage.getItem("tt_theme");
      if (t === "light" || t === "dark") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (e) { /* ignore */ }
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" data-nav="home">测试小站</button>
    <div class="nav-wrap">
      <nav class="nav">
        <button class="nav-item" data-nav="home">首页</button>
        <button class="nav-item active" data-nav="history">历史</button>
        <button class="nav-item" data-nav="settings">设置</button>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" title="主题：深色（点击切换）" aria-label="切换主题">
        <span class="theme-icon theme-icon-auto">🌗</span>
        <span class="theme-icon theme-icon-light">☀️</span>
        <span class="theme-icon theme-icon-dark">🌙</span>
      </button>
    </div>
  </div>
</header>

<main class="container">

  <!-- 首页：测试列表 -->
  <section id="view-home" class="view">
    <div class="page-head">
      <h1>心理测试小站</h1>
      <p class="subtitle">选一个测试，开始探索自己</p>
    </div>
    <div class="search-box">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input id="test-search" class="search-input" type="search" placeholder="搜索测试名称或描述…" autocomplete="off" aria-label="搜索测试">
      <button id="search-clear" class="search-clear" type="button" hidden="" aria-label="清空搜索">✕</button>
    </div>
    <p id="search-hint" class="search-hint" hidden=""></p>
    <div id="test-groups" class="test-groups"><div class="test-group open" data-gid="hot"><button class="group-header" type="button"><span class="group-icon">🔥</span><span class="group-name">热门测试</span><span class="group-count">1</span><span class="group-chev">▶</span></button><div class="group-body"><div class="test-grid"><button class="test-card" style="--card-accent: #0071e3;"><span class="test-icon" style="background:#0071e3">MB</span><span class="test-name">MBTI 人格测试</span><span class="test-desc">从能量来源、信息获取、决策方式、生活态度四个维度探索你的人格类型，共 16 种类型。</span><span class="test-meta"><span>60 题</span><span>约 5 分钟</span></span></button></div></div></div><div class="test-group open" data-gid="personality"><button class="group-header" type="button"><span class="group-icon">🧠</span><span class="group-name">人格测试</span><span class="group-count">2</span><span class="group-chev">▶</span></button><div class="group-body"><div class="test-grid"><button class="test-card" style="--card-accent: #8e8e93;"><span class="test-icon" style="background:#8e8e93">AT</span><span class="test-name">依恋类型测试</span><span class="test-desc">基于依恋理论，从「焦虑」与「回避」两个维度，了解你在亲密关系中的安全感模式。</span><span class="test-meta"><span>18 题</span><span>约 3 分钟</span></span></button><button class="test-card" style="--card-accent: #0071e3;"><span class="test-icon" style="background:#0071e3">MB</span><span class="test-name">MBTI 人格测试</span><span class="test-desc">从能量来源、信息获取、决策方式、生活态度四个维度探索你的人格类型，共 16 种类型。</span><span class="test-meta"><span>60 题</span><span>约 5 分钟</span></span></button></div></div></div><div class="test-group open" data-gid="mental"><button class="group-header" type="button"><span class="group-icon">💚</span><span class="group-name">心理健康测试</span><span class="group-count">1</span><span class="group-chev">▶</span></button><div class="group-body"><div class="test-grid"><button class="test-card" style="--card-accent: #af52de;"><span class="test-icon" style="background:#af52de">S90</span><span class="test-name">SCL-90 症状自评量表</span><span class="test-desc">90 道题，从躯体化、强迫、抑郁、焦虑等 10 个因子，评估你近一周的心理健康状况。</span><span class="test-meta"><span>90 题</span><span>约 10 分钟</span></span></button></div></div></div></div>
  </section>

  <!-- 答题页 -->
  <section id="view-test" class="view" hidden="">
    <div class="quiz-head">
      <div class="quiz-head-row">
        <button id="btn-quit" class="btn-quit" type="button" aria-label="返回首页" style="font-weight: bold">← 返回首页</button>
        <div class="quiz-meta">
          <span id="quiz-name" class="quiz-name">MBTI 人格测试</span>
          <span id="quiz-progress-text" class="quiz-progress-text">已完成 0 / 60 题</span>
        </div>
      </div>
      <div class="progress-track"><div id="quiz-progress-bar" class="progress-fill" style="width: 0%;"></div></div>
    </div>
    <div class="quiz-body">
      <div id="question-index" class="question-index">第 1 / 60 题</div>
      <h2 id="question-text" class="question-text">周末你更想怎么过？</h2>
      <div id="options" class="options-list"><button class="option-item"><span class="option-mark"></span><span>和朋友聚会，热闹一整天</span></button><button class="option-item"><span class="option-mark"></span><span>在家安静独处，做自己的事</span></button></div>
    </div>
    <div class="quiz-foot">
      <button id="btn-prev" class="btn ghost" disabled="">上一题</button>
      <div class="quiz-foot-right">
        <div class="save-progress" id="save-progress">
          <div class="save-progress-track"><div id="save-progress-fill" class="save-progress-fill" style="width: 0%;"></div></div>
          <span id="save-progress-text" class="save-progress-text">0%</span>
        </div>
        <span id="quiz-save-hint" class="save-hint">进度自动保存</span>
      </div>
    </div>
  </section>

  <!-- 结果页 -->
  <section id="view-result" class="view" hidden="">
    <div id="result-content"></div>
  </section>

  <!-- 历史页 -->
  <section id="view-history" class="view" hidden="">
    <div class="page-head">
      <h1>历史记录</h1>
      <p class="subtitle" id="history-subtitle">共 1 条记录</p>
      <div class="page-actions">
        <button id="btn-export-all" class="btn ghost">导出全部记录</button>
      </div>
    </div>
    <div id="history-list" class="history-list"><div class="history-item-wrap"><button class="history-item" data-idx="0"><span class="history-left"><span class="history-name">依恋类型测试</span><span class="history-result">恐惧型 · 恐惧型依恋</span><span class="history-time">2026-08-13 16:37</span></span></button><div class="history-actions"><button class="icon-btn" data-act="compare" data-idx="0" title="对比" style="width: 73.3333px; height: 40px;">对比🆚</button><button class="icon-btn" data-act="del" data-idx="0" title="删除" style="width: 66px; height: 40px;">删除👋</button></div></div><div class="history-item-wrap" data-cmp="1"><div class="history-compare"><h4>「依恋类型测试」多次结果对比</h4><div class="compare-row"><div class="compare-cell"><div class="c-label">2026-08-13 16:37</div><div class="c-value">恐惧型</div></div><div class="compare-cell"><div class="c-label">类型</div><div class="c-value">恐惧型依恋</div></div></div><button class="btn ghost" style="margin-top:8px" onclick="this.closest('.history-item-wrap').remove()">收起对比</button></div></div></div>
  </section>

  <!-- 设置页 -->
  <section id="view-settings" class="view" hidden="">
    <div class="page-head">
      <h1>设置</h1>
    </div>

    <div class="settings-block">
      <h3>大模型深度解读</h3>
      <p class="block-desc">配置 OpenAI 兼容接口后，结果页可一键调用大模型生成个性化深度报告。接口需支持浏览器跨域（CORS）。</p>
      <label class="field-label" for="set-base-url">Base URL</label>
      <input id="set-base-url" class="field-input" placeholder="https://api.openai.com/v1" autocomplete="off">
      <label class="field-label" for="set-api-key">API Key</label>
      <input id="set-api-key" class="field-input" type="password" placeholder="sk-..." autocomplete="off">
      <label class="field-label" for="set-model">模型名</label>
      <input id="set-model" class="field-input" placeholder="gpt-4o-mini" autocomplete="off">
      <div class="settings-actions">
        <button id="btn-save-llm" class="btn primary">保存配置</button>
        <button id="btn-test-llm" class="btn ghost">测试连接</button>
      </div>
      <div id="llm-status" class="status-line"></div>
    </div>

    <div class="settings-block">
      <h3>数据管理</h3>
      <p class="block-desc">所有测试数据仅保存在本机浏览器，导出后可自行备份（如放入项目文件夹享受 NAS 同步）。</p>
      <div class="settings-actions">
        <button id="btn-export-all-2" class="btn ghost">导出全部记录</button>
        <button id="btn-clear-data" class="btn danger">清空全部数据</button>
      </div>
      <div id="data-status" class="status-line"></div>
    </div>
  </section>

</main>

<footer class="foot">数据仅保存在本机浏览器 · 测试小站</footer>

<script src="mmpi2-data.js"></script>
<script src="mmpi2-score.js"></script>
<script src="tests-data.js"></script>
<script src="app.js"></script>

<!-- 自定义模态对话框（替代原生 confirm） -->
<div id="modal" class="modal" hidden="">
  <div id="modal-mask" class="modal-mask"></div>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-title" id="modal-title">温馨提示</div>
    <div class="modal-body" id="modal-body">确定删除这条记录吗？</div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn ghost" type="button">取消</button>
      <button id="modal-ok" class="btn primary" type="button" style="color: var(--danger);">删除</button>
    </div>
  </div>
</div>
</body>
</html>
